name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Check names: "generator / test" and "dashboard / test". Keep job ids stable.
  generator:
    uses: yogigodaraa/.github/.github/workflows/python-ci.yml@main
    with:
      working-directory: backend
      python-version: "3.12"

  dashboard:
    uses: yogigodaraa/.github/.github/workflows/node-ci.yml@main
    with:
      working-directory: dashboard
