<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mooring Data Dashboard</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .status-card {
            transition: all 0.3s ease;
        }
        .status-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .chart-container {
            position: relative;
            height: 300px;
        }
        .data-item {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .alert-badge {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .navbar-brand {
            font-weight: bold;
        }
        .connection-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .connected { background-color: #28a745; }
        .disconnected { background-color: #dc3545; }
        .sensor-value {
            font-family: 'Courier New', monospace;
        }
        .mooring-card {
            border-left: 4px solid #007bff;
        }
        .mooring-card.inactive {
            border-left-color: #6c757d;
            opacity: 0.7;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-water"></i> Mooring Data Dashboard
            </a>
            <div class="navbar-nav ms-auto">
                <div class="nav-item">
                    <span class="navbar-text">
                        <span id="connectionStatus" class="connection-status disconnected"></span>
                        <span id="connectionText">Disconnected</span>
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Status Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card status-card text-white bg-primary">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 class="card-title" id="totalReceived">0</h4>
                                <p class="card-text">Total Received</p>
                            </div>
                            <i class="bi bi-database-fill" style="font-size: 2rem;"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card status-card text-white bg-success">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 class="card-title" id="activeMoorings">0</h4>
                                <p class="card-text">Active Moorings</p>
                            </div>
                            <i class="bi bi-geo-alt-fill" style="font-size: 2rem;"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card status-card text-white bg-info">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 class="card-title" id="dataRate">0</h4>
                                <p class="card-text">Data Rate/Min</p>
                            </div>
                            <i class="bi bi-speedometer2" style="font-size: 2rem;"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card status-card text-white bg-warning">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 class="card-title" id="connectedClients">0</h4>
                                <p class="card-text">Connected Clients</p>
                            </div>
                            <i class="bi bi-people-fill" style="font-size: 2rem;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Charts Section -->
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-graph-up"></i> Real-time Sensor Data
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="sensorChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-list-ul"></i> Recent Data Stream
                        </h5>
                    </div>
                    <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                        <div id="dataStream"></div>
                    </div>
                </div>
            </div>

            <!-- Moorings and System Info -->
            <div class="col-lg-4">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-broadcast"></i> Active Moorings
                        </h5>
                    </div>
                    <div class="card-body" style="max-height: 300px; overflow-y: auto;">
                        <div id="mooringsList"></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-info-circle"></i> System Status
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-6">
                                <div class="border-end">
                                    <h6 id="lastReceived">Never</h6>
                                    <small class="text-muted">Last Received</small>
                                </div>
                            </div>
                            <div class="col-6">
                                <h6 id="systemUptime">0s</h6>
                                <small class="text-muted">System Uptime</small>
                            </div>
                        </div>
                        <hr>
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-primary btn-sm" onclick="requestHistoricalData()">
                                <i class="bi bi-download"></i> Load Historical Data
                            </button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="clearDataStream()">
                                <i class="bi bi-trash"></i> Clear Display
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // WebSocket connection
        const socket = io();
        let sensorChart;
        const chartData = {
            temperature: [],
            wave_height: [],
            current_speed: [],
            wind_speed: []
        };
        const maxChartPoints = 50;

        // Connection status handling
        socket.on('connect', () => {
            updateConnectionStatus(true);
        });

        socket.on('disconnect', () => {
            updateConnectionStatus(false);
        });

        function updateConnectionStatus(connected) {
            const statusEl = document.getElementById('connectionStatus');
            const textEl = document.getElementById('connectionText');
            
            if (connected) {
                statusEl.className = 'connection-status connected';
                textEl.textContent = 'Connected';
            } else {
                statusEl.className = 'connection-status disconnected';
                textEl.textContent = 'Disconnected';
            }
        }

        // Initialize Chart.js
        function initChart() {
            const ctx = document.getElementById('sensorChart').getContext('2d');
            sensorChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Temperature (°C)',
                        data: [],
                        borderColor: '#dc3545',
                        backgroundColor: 'rgba(220, 53, 69, 0.1)',
                        tension: 0.4
                    }, {
                        label: 'Wave Height (m)',
                        data: [],
                        borderColor: '#007bff',
                        backgroundColor: 'rgba(0, 123, 255, 0.1)',
                        tension: 0.4
                    }, {
                        label: 'Current Speed (m/s)',
                        data: [],
                        borderColor: '#28a745',
                        backgroundColor: 'rgba(40, 167, 69, 0.1)',
                        tension: 0.4
                    }, {
                        label: 'Wind Speed (m/s)',
                        data: [],
                        borderColor: '#ffc107',
                        backgroundColor: 'rgba(255, 193, 7, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    }
                }
            });
        }

        // Handle incoming data
        socket.on('newMooringData', (data) => {
            addDataToChart(data);
            addToDataStream(data);
            updateMooringsList(data);
        });

        socket.on('stats', (stats) => {
            updateStats(stats);
        });

        socket.on('recentData', (data) => {
            data.forEach(record => addToDataStream(record));
        });

        function addDataToChart(data) {
            const timestamp = new Date(data.timestamp).toLocaleTimeString();
            
            // Extract sensor values
            const sensorValues = {};
            data.sensors.forEach(sensor => {
                sensorValues[sensor.sensor_type] = sensor.value;
            });

            // Add to chart
            sensorChart.data.labels.push(timestamp);
            sensorChart.data.datasets[0].data.push(sensorValues.temperature || null);
            sensorChart.data.datasets[1].data.push(sensorValues.wave_height || null);
            sensorChart.data.datasets[2].data.push(sensorValues.current_speed || null);
            sensorChart.data.datasets[3].data.push(sensorValues.wind_speed || null);

            // Keep only last N points
            if (sensorChart.data.labels.length > maxChartPoints) {
                sensorChart.data.labels.shift();
                sensorChart.data.datasets.forEach(dataset => dataset.data.shift());
            }

            sensorChart.update('none');
        }

        function addToDataStream(data) {
            const streamEl = document.getElementById('dataStream');
            const timestamp = new Date(data.timestamp).toLocaleString();
            
            const sensorSummary = data.sensors.map(s => 
                `${s.sensor_type}: ${s.value} ${s.unit}`
            ).slice(0, 3).join(', ') + (data.sensors.length > 3 ? '...' : '');

            const alertBadge = data.system_status.alerts.length > 0 
                ? `<span class="badge bg-warning alert-badge">${data.system_status.alerts.length} alerts</span>`
                : '';

            const itemHtml = `
                <div class="data-item border-start border-3 border-primary ps-3 pb-3 mb-3">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1">${data.mooring_id}</h6>
                            <p class="mb-1 sensor-value">${sensorSummary}</p>
                            <small class="text-muted">${timestamp}</small>
                        </div>
                        <div>
                            ${alertBadge}
                        </div>
                    </div>
                </div>
            `;
            
            streamEl.insertAdjacentHTML('afterbegin', itemHtml);
            
            // Keep only last 20 items
            const items = streamEl.children;
            while (items.length > 20) {
                streamEl.removeChild(items[items.length - 1]);
            }
        }

        function updateStats(stats) {
            document.getElementById('totalReceived').textContent = stats.totalReceived || 0;
            document.getElementById('activeMoorings').textContent = stats.uniqueMoorings || 0;
            document.getElementById('dataRate').textContent = stats.dataRate || 0;
            document.getElementById('connectedClients').textContent = stats.connectedClients || 0;
            
            if (stats.lastReceived) {
                const lastReceived = new Date(stats.lastReceived);
                document.getElementById('lastReceived').textContent = lastReceived.toLocaleTimeString();
            }
        }

        function updateMooringsList(data) {
            // This is a simplified update - in a real app you'd maintain a proper moorings list
            const mooringsEl = document.getElementById('mooringsList');
            const timestamp = new Date(data.timestamp).toLocaleString();
            
            const mooringHtml = `
                <div class="card mooring-card mb-2">
                    <div class="card-body p-2">
                        <h6 class="card-title mb-1">${data.mooring_id}</h6>
                        <small class="text-muted">
                            <i class="bi bi-geo-alt"></i> 
                            ${data.location.latitude.toFixed(4)}, ${data.location.longitude.toFixed(4)}
                        </small>
                        <br>
                        <small class="text-muted">Last seen: ${timestamp}</small>
                        <div class="mt-1">
                            <span class="badge bg-success">Battery: ${data.system_status.battery_level}%</span>
                            ${data.system_status.alerts.length > 0 ? 
                                `<span class="badge bg-warning">${data.system_status.alerts.length} alerts</span>` : 
                                '<span class="badge bg-primary">OK</span>'
                            }
                        </div>
                    </div>
                </div>
            `;
            
            // For demo purposes, just add to top (in real app, you'd update existing entries)
            if (mooringsEl.children.length > 5) {
                mooringsEl.removeChild(mooringsEl.lastChild);
            }
            mooringsEl.insertAdjacentHTML('afterbegin', mooringHtml);
        }

        function requestHistoricalData() {
            socket.emit('requestData', { limit: 100 });
        }

        function clearDataStream() {
            document.getElementById('dataStream').innerHTML = '';
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            updateConnectionStatus(false);
            
            // Update uptime every second
            setInterval(() => {
                fetch('/api/status')
                    .then(response => response.json())
                    .then(data => {
                        const uptime = formatUptime(data.uptime);
                        document.getElementById('systemUptime').textContent = uptime;
                    })
                    .catch(() => {});
            }, 1000);
        });

        function formatUptime(seconds) {
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (days > 0) return `${days}d ${hours}h`;
            if (hours > 0) return `${hours}h ${minutes}m`;
            if (minutes > 0) return `${minutes}m ${secs}s`;
            return `${secs}s`;
        }
    </script>
</body>
</html>
