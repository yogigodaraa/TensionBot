[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mooring-data-generator"
version = "0.1.0"
description = "A simple script to generate fake mooring data for use in a hackathon"
readme = "README.md"
authors = [
    { name = "BHP UWA", email = "example@example.com" },
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "requests>=2.34.2",
    "click>=8.5.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.15.0",
    "fastapi>=0.142.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "tox>=4.64.8",
    "pytest>=7.0.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
mooring-data-generator = "mooring_data_generator.cli:main"
mooring-data-receiver = "mooring_data_generator.receiver:main"

[project.urls]
Homepage = "https://github.com/bhp-uwa/mooring-data-generator"
Issues = "https://github.com/bhp-uwa/mooring-data-generator/issues"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["mooring_data_generator"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py38,py39,py310,py311,py312
isolated_build = true

[testenv]
deps =
    pytest
    pytest-cov
    requests-mock
commands =
    pytest {posargs}

[testenv:lint]
deps =
    ruff
commands =
    ruff check src tests
    ruff format --check src tests

[testenv:format]
deps =
    ruff
commands =
    ruff format src tests
    ruff check --fix src tests
"""